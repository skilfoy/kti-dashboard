# Build, test and deploy the site and the threat-feeds service to Vercel (production).
#   push to main       validate, assemble with the last built feeds (rebuilt first when over nine hours old), test, deploy
#   pull request       validate, assemble, test (no deploy)
#   schedule           three times a day: rebuild every machine-built dataset from its sources first, then as a push
#   manual run         as a push; tick "rebuild_feeds" to rebuild the feeds too
# Needs one repository secret, VERCEL_TOKEN (a Vercel access token scoped to the skilfoys-projects team).
name: Site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every eight hours. The 10:23 UTC run lands ahead of the 06:45 CT reassessment (11:45 UTC in summer, 12:45 in winter).
    - cron: "23 2,10,18 * * *"
  workflow_dispatch:
    inputs:
      rebuild_feeds:
        description: Rebuild every machine-built dataset from its sources
        type: boolean
        default: false
      verify_max:
        description: Cited pages to fetch for citation verification in this run (default 150; 1500 for a full sweep)
        type: string
        default: "150"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_J1AYAuYaWSGEP7cjBp80rdJp
  VERCEL_PROJECT_ID: prj_eISaKjcBNEHSxvuO7OvW6Nf94s5P
  VERCEL_TELEMETRY_DISABLED: "1"
  PUBLIC_DOMAIN: intel.kilfoycyber.com
  # The operator side: the project's team-scoped *.vercel.app address behind Vercel Authentication, where /api/admin answers.
  OPERATOR_HOST: threat-feeds-skilfoys-projects.vercel.app

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml==6.0.2
          npm ci
          npm i --no-save @electric-sql/pglite@0.5.8 playwright@1.64.0

      # The machine-built datasets live in the Actions cache between runs: each rebuild saves a new entry and every
      # other run restores the newest one.
      - name: Restore built feeds
        id: feeds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: feeds
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      # GitHub starts scheduled runs on a best-effort basis and can start one hours late or skip a slot under load, so a
      # push to main rebuilds the feeds itself when the last rebuild attempt is more than nine hours old.
      - name: Check the age of the built feeds
        id: age
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'EOF'
          import datetime as dt, json
          try:
              at = json.load(open("feeds/_build.json"))["attempted"]
              hours = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(at.replace("Z", "+00:00"))).total_seconds() / 3600
          except (OSError, ValueError, KeyError, TypeError):
              hours = float("inf")
          print(f"hours={hours:.1f}")
          print("stale=" + ("true" if hours > 9 else "false"))
          EOF

      # A failed rebuild leaves the restored datasets in place, so the site still deploys with the last good feeds;
      # site_build.py stops the run when a dataset is missing altogether.
      - name: Rebuild feeds from their sources
        id: rebuild
        if: >-
          github.event_name == 'schedule' || inputs.rebuild_feeds || steps.feeds.outputs.cache-matched-key == '' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.age.outputs.stale == 'true')
        continue-on-error: true
        run: |
          python3 -I pipeline/build_feeds.py "$RUNNER_TEMP/work" feeds "$(date -u +%F)"
          rm -rf "$RUNNER_TEMP/work"

      - name: Note a failed rebuild
        if: steps.rebuild.outcome == 'failure'
        run: echo "::warning::The feed rebuild failed; this run uses the last good feeds. See the Rebuild step log and feeds/_build.json."

      - name: Save built feeds
        if: steps.rebuild.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: feeds
          key: feeds-${{ github.run_id }}

      # Currency rules (overdue reviews, passed horizons) print as WARN lines here and never fail a deploy: they gate
      # the reassessment itself, and the "Reassessment watch" workflow raises them as an issue.
      - name: Validate the authored datasets
        run: |
          set -o pipefail
          python3 -I pipeline/authored_build.py data/authored --check | tee validate.txt
          grep '^WARN ' validate.txt | sed 's/^WARN /::warning::/' || true
          rm -f validate.txt

      # Citation verification, without a model: fetch cited pages and record whether each carries its item's claim
      # (pipeline/verify_citations.py). Results persist in their own cache and build up over runs: new items first,
      # then retries, then the oldest verified pages. On a pull request the gate fails the check when a new item
      # (I-1126 on) cites a page that is gone or does not carry the claim, so such an item cannot reach main.
      - name: Restore citation verification state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: verification
          key: verification-${{ github.run_id }}
          restore-keys: verification-

      - name: Verify citations
        env:
          VERIFY_MAX: ${{ inputs.verify_max || '150' }}
        run: |
          set -o pipefail
          mkdir -p verification
          python3 -I pipeline/verify_citations.py --items data/authored/items.json --state verification/state.json \
            --out feeds/verification.json --max "$VERIFY_MAX" --gate-from 1126 | tee verify.txt
          tail -n 12 verify.txt >> "$GITHUB_STEP_SUMMARY"
          rm -f verify.txt

      - name: Save citation verification state
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: verification
          key: verification-${{ github.run_id }}

      - name: Assemble the site data
        run: python3 -I pipeline/site_build.py --authored data/authored --feeds feeds --out public --commit "$GITHUB_SHA"

      - name: Offline tests
        run: node test/run_all.mjs

      - name: Browser check (desktop and phone, light and dark)
        run: |
          npx playwright install --with-deps chromium
          node test/e2e.mjs --live-optional

      # Idempotent: attaches the public domain to the Vercel project once, then reports its verification state.
      - name: Attach the public domain
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Add the VERCEL_TOKEN repository secret to deploy"; exit 1; }
          api="https://api.vercel.com"
          q="teamId=$VERCEL_ORG_ID"
          code=$(curl -sS -o domain.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v9/projects/$VERCEL_PROJECT_ID/domains/$PUBLIC_DOMAIN?$q")
          if [ "$code" = "404" ]; then
            code=$(curl -sS -o domain.json -w '%{http_code}' -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$PUBLIC_DOMAIN\"}" "$api/v10/projects/$VERCEL_PROJECT_ID/domains?$q")
          fi
          echo "Vercel answered HTTP $code for $PUBLIC_DOMAIN"
          python3 -c "import json; d=json.load(open('domain.json')); print(json.dumps({k: d.get(k) for k in ('name','verified','verification','error')}, indent=1))" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS -o config.json -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v6/domains/$PUBLIC_DOMAIN/config?$q&projectIdOrName=$VERCEL_PROJECT_ID" || true
          python3 -c "import json; d=json.load(open('config.json')); print('DNS misconfigured:', d.get('misconfigured'), '| recommended CNAME:', (d.get('recommendedCNAME') or [{}])[0].get('value'))" | tee -a "$GITHUB_STEP_SUMMARY" || true
          rm -f domain.json config.json
          # Retired addresses (14 November 2026): project-dcxjt.vercel.app predates the public domain. Removed if present.
          for old in project-dcxjt.vercel.app; do
            rc=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" "$api/v9/projects/$VERCEL_PROJECT_ID/domains/$old?$q")
            echo "Retired address $old: HTTP $rc (200 removed, 404 already absent)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          case "$code" in 2*) ;; *) echo "::warning::Could not attach $PUBLIC_DOMAIN (HTTP $code); the deploy continues" ;; esac

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Add the VERCEL_TOKEN repository secret to deploy"; exit 1; }
          npm i -g vercel@63.1.2
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # A production deploy normally takes every production domain, but one attached moments earlier can stay on the
          # previous deployment; pointing it explicitly makes the public site follow every deploy.
          vercel alias set "$url" "$PUBLIC_DOMAIN" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
          echo "Pointed $PUBLIC_DOMAIN at $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # The operator side stopped following production deploys on 2 November 2026 and served that day's build and
          # service code for eleven days, so the daily run read stale catalogs through it. It is pointed explicitly too.
          if vercel alias set "$url" "$OPERATOR_HOST" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"; then
            echo "Pointed $OPERATOR_HOST at $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not point $OPERATOR_HOST at $url; the operator side may serve an older deployment"
          fi

      # Until DNS for the public domain resolves to Vercel this check warns instead of failing the run.
      - name: Check the public site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          sleep 20
          if getent hosts "$PUBLIC_DOMAIN" > /dev/null; then EXPECT_COMMIT="$GITHUB_SHA" node test/smoke.mjs "https://$PUBLIC_DOMAIN"
          else echo "::warning::$PUBLIC_DOMAIN does not resolve yet; add its DNS record to check the public site"; fi
